name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Deploying from Actions needs the Cloudflare secrets. Until they exist (or
  # when Cloudflare Pages builds the repo itself), the deploy is skipped
  # rather than failed.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # full history so the changelog has entries
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version', cache: 'npm' }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=market-maps
